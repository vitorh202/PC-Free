services:
  windows:
      image: dockurr/windows
      container_name: windows
      network_mode: bridge

      dns:
         - 1.1.1.1
         - 8.8.8.8

      environment:
        VERSION: "10l"
        USERNAME: ${WINDOWS_USERNAME}
        PASSWORD: ${WINDOWS_PASSWORD}
        RAM_SIZE: "3G"
        CPU_CORES: "2"

      cap_add:
        - NET_ADMIN

      ports:
        - "8006:8006"
        - "3389:3389/tcp"

      volumes:
        - /tmp/docker-data:/mnt/disco1
        - windows-data:/mnt/windows-data
        - windows-data-system:/storage

      devices:
        - "/dev/kvm:/dev/kvm"
        - "/dev/net/tun:/dev/net/tun"

      stop_grace_period: 2m
      restart: "no"

volumes:
  windows-data:
  windowns-data-system:
